name: audit-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -U pip -r requirements.txt

      - name: Run audit gate (all suites)
        run: python tests/run_audit_gate.py

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-gate-artifacts
          path: |
            tests/*telemetry*.json
            docs/reports/artifacts/*.json
          retention-days: 30
