name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - run: git config core.autocrlf false

      - name: Normalize shell script line endings
        run: |
          python -c "
          from pathlib import Path
          for name in ['install.sh','deploy-vps.sh','deploy-android.sh']:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n'), encoding='utf-8', newline='\n')
          "

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pip==25.1.1
          python -m pip install -r requirements.txt

      - name: Test coverage (pytest-cov)
        env:
          MYTHOS_SMOKE: "1"
          ULTRA_SMOKE: "1"
          ADVERSARIAL_SMOKE: "1"
        run: |
          coverage run --source=tests tests/test_stt_mythos_ultimate.py
          coverage run -a --source=tests tests/test_ultra_heavy_audit.py
          coverage run -a --source=tests tests/test_sherlock_adversarial.py
          coverage run -a --source=tests tests/benchmark_stt_market.py
          coverage xml -o coverage.xml
          coverage report --fail-under=50

      - name: Mythos acoustic audit — CI verification
        env:
          MYTHOS_SMOKE: "1"
        run: python tests/test_stt_mythos_ultimate.py

      - name: Ultra heavy infrastructure audit — CI verification
        env:
          ULTRA_SMOKE: "1"
        run: python tests/test_ultra_heavy_audit.py

      - name: Sherlock adversarial audit — CI verification
        shell: bash
        env:
          ADVERSARIAL_SMOKE: "1"
        run: python tests/test_sherlock_adversarial.py

      - name: STT market benchmark
        run: python tests/benchmark_stt_market.py

      - name: Upload audit telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telemetry-${{ matrix.os }}
          path: |
            tests/stt_ultimate_telemetry.json
            tests/heavy_audit_telemetry.json
            tests/sherlock_adversarial_telemetry.json
            docs/reports/artifacts/benchmark_stt_market.json
          retention-days: 30

      - name: Deployment script syntax check
        shell: bash
        run: |
          bash -n install.sh
          bash -n deploy-vps.sh
          bash -n deploy-android.sh
