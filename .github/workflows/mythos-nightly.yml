name: mythos-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Full Mythos audit (10,000-step soak)
        run: python tests/test_stt_mythos_ultimate.py

      - name: Full ultra heavy audit (50,000-step soak)
        run: python tests/test_ultra_heavy_audit.py

      - name: Upload full telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mythos-nightly-telemetry
          path: |
            tests/stt_ultimate_telemetry.json
            tests/heavy_audit_telemetry.json
          retention-days: 90
