name: mythos-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -U pip numpy psutil

      - name: Full Mythos audit (10,000-step soak)
        run: python tests/test_stt_mythos_ultimate.py

      - name: Full ultra heavy audit (50,000-step soak)
        run: python tests/test_ultra_heavy_audit.py

      - name: Upload full telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-nightly-telemetry
          path: |
            tests/stt_ultimate_telemetry.json
            tests/heavy_audit_telemetry.json
          retention-days: 90
